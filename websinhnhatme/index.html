<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chúc Mừng Sinh Nhật Mẹ Kính Yêu 🎂 26/10 🌸</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Dữ liệu 5 ảnh gia đình chân thực của Mẹ -->
    <script src="photos_data.js"></script>

    <style>
        :root {
            --primary-rose: #ff4d6d;
            --rose-light: #ff758f;
            --rose-dark: #be123c;
            --rose-glow: rgba(255, 77, 109, 0.65);
            --gold: #ffd166;
            --gold-light: #fef08a;
            --gold-dark: #d97706;
            --gold-glow: rgba(255, 209, 102, 0.7);
            --bg-night: #08030d;
            --card-glass: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 209, 102, 0.28);
            --card-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 45px rgba(255, 77, 109, 0.2);
            --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-serif: 'Playfair Display', serif;
            --font-script: 'Dancing Script', cursive;
            --font-calligraphy: 'Alex Brush', cursive;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-night);
            color: #ffffff;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }

        /* ========================================================
           LỚP NỀN HÌNH ẢNH HOA HỒNG & NẾN SINH NHẬT CỦA MẸ
           ======================================================== */
        .cosmic-aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            background: url('background.jpg') center center / cover no-repeat;
        }

        .aurora-orb {
            display: none;
        }

        .aurora-orb-1 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #ff4d6d 0%, rgba(201, 24, 74, 0.2) 70%, transparent 100%);
            top: -80px;
            left: 15%;
            animation-duration: 18s;
        }

        .aurora-orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ffd166 0%, rgba(245, 158, 11, 0.2) 70%, transparent 100%);
            bottom: -100px;
            right: 10%;
            animation-duration: 25s;
            animation-delay: -5s;
        }

        .aurora-orb-3 {
            width: 360px;
            height: 360px;
            background: radial-gradient(circle, #8338ec 0%, rgba(131, 56, 236, 0.15) 70%, transparent 100%);
            top: 40%;
            right: 25%;
            animation-duration: 20s;
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(45px, 60px) scale(1.15); }
            100% { transform: translate(-35px, -40px) scale(0.9); }
        }

        /* Hạt bụi tiên lấp lánh nhẹ nhàng */
        .ambient-dust {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(1.5px 1.5px at 30px 40px, rgba(255, 255, 255, 0.95), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 220px, rgba(255, 77, 109, 0.7), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 290px 120px, rgba(255, 209, 102, 0.85), rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 380px 320px, rgba(255, 182, 193, 0.6), rgba(0,0,0,0));
            background-size: 420px 420px;
            opacity: 0.65;
            z-index: 1;
            animation: dustDrift 36s infinite linear;
        }

        @keyframes dustDrift {
            from { background-position: 0 0; }
            to { background-position: 420px 420px; }
        }

        /* ========================================================
           KHUNG CHỨA TOÀN BỘ MÀN HÌNH
           ======================================================== */
        .app-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            z-index: 10;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* ========================================================
           MÀN HÌNH 1: BẢNG MẬT KHẨU SỐ 2610 HOÀNG GIA
           ======================================================== */
        #screen-passcode {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0b0107 url('background.jpg') center center / cover no-repeat;
            position: relative;
            overflow: hidden;
        }

        /* Ảnh nền 4K phủ kín 100% toàn màn hình sắc nét */
        .passcode-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            z-index: 0;
            pointer-events: none;
            user-select: none;
        }

        .passcode-card {
            background: rgba(14, 14, 18, 0.88);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1.5px solid rgba(255, 120, 145, 0.7);
            border-radius: 34px;
            padding: 26px 22px 22px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.85),
                0 0 30px rgba(255, 95, 130, 0.5),
                0 0 12px rgba(255, 140, 170, 0.4),
                inset 0 0 15px rgba(255, 120, 145, 0.15);
            text-align: center;
            position: relative;
            z-index: 2;
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
            transition: all 0.28s ease;
        }

        /* Hiệu ứng khi ấn số: đường viền & background đen huyền bí bừng sáng hào quang đỏ nhạt */
        .passcode-card.card-pulse {
            background: rgba(22, 16, 22, 0.92);
            border-color: rgba(255, 150, 175, 0.95);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.9),
                0 0 45px rgba(255, 80, 125, 0.75),
                0 0 20px rgba(255, 130, 160, 0.6),
                inset 0 0 20px rgba(255, 140, 170, 0.25);
            transform: scale(1.02);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(35px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Hoa văn viền góc thẻ đồng điệu tông đỏ hồng nhạt */
        .card-corner-decor {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 1.5px solid rgba(255, 140, 175, 0.8);
            pointer-events: none;
            opacity: 0.8;
            filter: drop-shadow(0 0 4px rgba(255, 105, 145, 0.6));
        }

        .card-corner-tl { top: 12px; left: 12px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
        .card-corner-tr { top: 12px; right: 12px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
        .card-corner-bl { bottom: 12px; left: 12px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
        .card-corner-br { bottom: 12px; right: 12px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

        /* Huy hiệu bánh kem nổi 3D với vòng hào quang xoay */
        .badge-halo-wrapper {
            position: relative;
            width: 72px;
            height: 72px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-halo-ring {
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, #ffd166 120deg, #ff4d6d 240deg, transparent 360deg);
            animation: spinRing 4s linear infinite;
            filter: blur(2px);
            opacity: 0.85;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        .passcode-badge {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ff8fa3 0%, #ff4d6d 45%, #b91c1c 85%, #500724 100%);
            border: 2px solid rgba(255, 240, 200, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: #fffdf5;
            z-index: 2;
            box-shadow: 0 8px 24px rgba(255, 77, 109, 0.65), 0 0 15px rgba(255, 214, 110, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.7);
            animation: badgeFloat 3s infinite ease-in-out;
        }

        @keyframes badgeFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .passcode-title {
            font-family: var(--font-script);
            font-size: 2.2rem;
            background: linear-gradient(135deg, #ffffff 0%, #ffe9b8 35%, #ffd166 70%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3px;
            font-weight: 700;
            filter: drop-shadow(0 2px 10px rgba(255, 209, 102, 0.5));
            line-height: 1.2;
        }

        .passcode-subtitle {
            font-size: 1.05rem;
            color: #fff1f2;
            margin-bottom: 22px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
            line-height: 1.4;
        }

        /* 4 Ô hiển thị mật khẩu hình bông hoa anh đào nở khi gõ số 🌸 */
        .passcode-dots {
            display: flex;
            gap: 14px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1.5px solid rgba(255, 120, 145, 0.55);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.85), 0 0 16px rgba(255, 95, 130, 0.35);
            align-items: center;
            justify-content: center;
        }

        .dot {
            width: 36px;
            height: 36px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dot-flower-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .dot-flower-path {
            fill: rgba(255, 255, 255, 0.08);
            stroke: rgba(255, 209, 102, 0.45);
            stroke-width: 2;
            transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dot-flower-pistil {
            fill: rgba(255, 209, 102, 0.2);
            stroke: rgba(255, 209, 102, 0.35);
            stroke-width: 1;
            transition: all 0.28s ease;
        }

        /* Ẩn hoàn toàn chữ số, chỉ hiển thị bông hoa nở khi ấn phím */
        .dot-value {
            display: none !important;
        }

        /* Khi đã nhập số: bông hoa bừng sáng màu hồng nhạt và bung nở cánh hoa (không hiện số) */
        .dot.filled {
            transform: scale(1.28) rotate(12deg);
        }

        .dot.filled .dot-flower-path {
            fill: #ffccd5;
            stroke: #ffd166;
            stroke-width: 2.6;
            filter: drop-shadow(0 0 14px rgba(255, 77, 109, 0.95)) drop-shadow(0 0 6px #ffd166);
        }

        .dot.filled .dot-flower-pistil {
            fill: #ffd166;
            stroke: #d97706;
            stroke-width: 1.5;
            filter: drop-shadow(0 0 5px #ffd166);
        }

        /* Khi nhập sai: bông hoa rung lắc đỏ cảnh báo */
        .dot.error {
            animation: shakeDots 0.45s ease;
        }

        .dot.error .dot-flower-path {
            fill: #ef4444;
            stroke: #ffffff;
            stroke-width: 2.6;
            filter: drop-shadow(0 0 16px #ef4444);
        }

        .dot.error .dot-flower-pistil {
            fill: #ffffff;
            stroke: #991b1b;
        }

        /* Khi nhập đúng: cả 4 bông hoa bừng sáng ánh vàng hồng nhạt chúc mừng */
        .dot.correct {
            transform: scale(1.35) rotate(0deg);
        }

        .dot.correct .dot-flower-path {
            fill: #ffccd5;
            stroke: #ffd166;
            stroke-width: 3.2;
            filter: drop-shadow(0 0 22px #ffd166) drop-shadow(0 0 16px #ff4d6d);
        }

        .dot.correct .dot-flower-pistil {
            fill: #fffdf5;
            stroke: #d97706;
            filter: drop-shadow(0 0 8px #ffd166);
        }

        @keyframes shakeDots {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-9px); }
            60% { transform: translateX(9px); }
            80% { transform: translateX(-4px); }
        }

        /* Bàn phím số phong cách đóa hoa anh đào 5 cánh (Sakura Blossom Flower Keys 🌸) */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px 14px;
            width: 100%;
            max-width: 260px;
        }

        .key-btn {
            width: 66px;
            height: 66px;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-tap-highlight-color: transparent;
            padding: 0;
        }

        .key-btn:hover {
            transform: translateY(-3px) scale(1.08) rotate(4deg);
        }

        .key-btn:active,
        .key-btn.active {
            transform: translateY(1px) scale(0.92);
        }

        /* Hình khối đóa hoa 5 cánh SVG 🌸 */
        .flower-shape-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .flower-petals-path {
            fill: #ffccd5;
            stroke: rgba(255, 209, 102, 0.9);
            stroke-width: 2.2;
            transition: all 0.25s ease;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 8px rgba(255, 117, 143, 0.5));
        }

        .flower-pistil {
            fill: rgba(255, 245, 248, 0.7);
            stroke: rgba(217, 119, 6, 0.55);
            stroke-width: 1.2;
            stroke-dasharray: 2 2;
            transition: all 0.25s ease;
        }

        .key-btn:hover .flower-petals-path {
            fill: #ffe4e6;
            stroke: #ffd166;
            stroke-width: 2.8;
            filter: drop-shadow(0 0 16px rgba(255, 117, 143, 0.95)) drop-shadow(0 0 8px #ffd166);
        }

        .key-btn:hover .flower-pistil {
            fill: #ffffff;
            stroke: #d97706;
        }

        .key-btn:active .flower-petals-path,
        .key-btn.active .flower-petals-path {
            fill: #ff758f;
            stroke: #ffffff;
            stroke-width: 3.2;
            filter: drop-shadow(0 0 20px #ffd166) drop-shadow(0 0 12px #ff4d6d);
        }

        .key-btn.action-btn .flower-petals-path {
            fill: #fecdd3;
            stroke: rgba(225, 29, 72, 0.75);
        }

        .key-btn.action-btn:hover .flower-petals-path {
            fill: #fda4af;
            stroke: #ffd166;
            filter: drop-shadow(0 0 16px rgba(255, 77, 109, 0.95));
        }

        .key-label {
            position: relative;
            z-index: 2;
            font-family: var(--font-main);
            font-size: 1.7rem;
            font-weight: 800;
            color: #4a041f;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
            pointer-events: none;
            transition: all 0.25s ease;
            user-select: none;
            line-height: 1;
        }

        .key-btn:hover .key-label {
            color: #2b0212;
            text-shadow: 0 0 8px rgba(255, 209, 102, 0.8), 0 1px 2px rgba(255, 255, 255, 0.9);
            transform: scale(1.08);
        }

        .key-btn:active .key-label,
        .key-btn.active .key-label {
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .key-btn.action-btn .key-label {
            font-size: 1.25rem;
            color: #881337;
        }

        /* ========================================================
           MÀN HÌNH 2: ĐẾM NGƯỢC 4 3 2 1 ĐIỆN ẢNH
           ======================================================== */
        #screen-countdown {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, #29081a 0%, #12020b 60%, #030003 100%);
            z-index: 50;
        }

        .countdown-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .countdown-number {
            font-family: 'Arial', sans-serif;
            font-size: 11rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 10%, #ffd166 50%, #ff4d6d 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 45px rgba(255, 209, 102, 0.85)) drop-shadow(0 0 80px rgba(255, 77, 109, 0.6));
            line-height: 1;
            transform: scale(0.5);
            opacity: 0;
            animation: countZoom 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes countZoom {
            0% { transform: scale(2.2); opacity: 0; }
            25% { transform: scale(1); opacity: 1; }
            80% { transform: scale(0.98); opacity: 1; }
            100% { transform: scale(0.75); opacity: 0; }
        }

        /* ========================================================
           MÀN HÌNH 3: BÁNH KEM 3D TỪ TIA SÁNG + NẾN LUNG LINH
           ======================================================== */
        #screen-cake-3d {
            flex-direction: column;
            background: radial-gradient(circle at 50% 35%, #22091d 0%, #0e020d 60%, #030004 100%);
        }

        #webgl-cake-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
            z-index: 1;
        }

        #cake-fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .cake-ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 26px 20px 40px;
        }

        .cake-header {
            text-align: center;
            pointer-events: auto;
            padding: 10px 20px;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cake-title {
            font-family: var(--font-script);
            font-size: 2.7rem;
            background: linear-gradient(135deg, #ffffff 0%, #ffd166 60%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            filter: drop-shadow(0 2px 16px rgba(255, 209, 102, 0.6));
            line-height: 1.2;
            margin-bottom: 0;
        }

        .cake-subtitle {
            font-size: 0.98rem;
            color: #ffe4e6;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        /* Lá thư 💌 chiều rộng ~100px trôi từ dưới lên dừng lại ở phần đáy bánh */
        .floating-envelope-wrapper {
            position: absolute;
            bottom: clamp(110px, 20vh, 180px);
            left: 50%;
            transform: translateX(-50%) translateY(100vh);
            opacity: 0;
            pointer-events: none;
            z-index: 30;
            transition: transform 1.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-envelope-wrapper.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .envelope-card {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            cursor: pointer;
            user-select: none;
            animation: envelopeFloatGently 2.4s ease-in-out infinite;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .envelope-giant-emoji {
            font-size: 100px;
            line-height: 1;
            display: block;
            filter: 
                drop-shadow(0 0 25px rgba(255, 77, 109, 0.85)) 
                drop-shadow(0 0 45px rgba(255, 209, 102, 0.65)) 
                drop-shadow(0 12px 24px rgba(0, 0, 0, 0.75));
            animation: envelopePulse 2.2s infinite ease-in-out;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .envelope-hint-text {
            font-family: var(--font-script);
            font-size: 1.5rem;
            color: #ffd166;
            background: rgba(15, 2, 14, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 4px 18px 5px;
            border-radius: 20px;
            border: 1px solid rgba(255, 209, 102, 0.45);
            box-shadow: 
                0 4px 18px rgba(0, 0, 0, 0.65), 
                0 0 20px rgba(255, 77, 109, 0.45);
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            animation: hintTextGlow 2.4s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .envelope-card:hover .envelope-hint-text {
            background: rgba(190, 18, 60, 0.85);
            border-color: #ffd166;
            color: #ffffff;
            box-shadow: 
                0 6px 24px rgba(0, 0, 0, 0.75), 
                0 0 25px rgba(255, 209, 102, 0.85);
            transform: scale(1.05);
        }

        @keyframes hintTextGlow {
            0%, 100% {
                opacity: 0.9;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.03);
                box-shadow: 
                    0 4px 20px rgba(0, 0, 0, 0.65), 
                    0 0 28px rgba(255, 209, 102, 0.75);
            }
        }

        .envelope-card:hover .envelope-giant-emoji {
            filter: 
                drop-shadow(0 0 35px rgba(255, 77, 109, 1.0)) 
                drop-shadow(0 0 60px rgba(255, 209, 102, 0.85)) 
                drop-shadow(0 16px 28px rgba(0, 0, 0, 0.85));
            transform: scale(1.10);
        }

        .envelope-card:active .envelope-giant-emoji {
            transform: scale(0.92);
        }

        @keyframes envelopeFloatGently {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes envelopePulse {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.06); }
            30% { transform: scale(1); }
            45% { transform: scale(1.04); }
        }
            letter-spacing: 0.4px;
        }

        .btn-to-letter:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 14px 35px rgba(255, 77, 109, 0.7);
        }

        /* ========================================================
           MÀN HÌNH 4: BỨC THƯ TAY HOÀNG GIA HIỆN RA NGAY LẬP TỨC
           ======================================================== */
        #screen-letter {
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at 50% 20%, #fff0f5 0%, #fde2e8 35%, #fcc2d0 70%, #f9a8bd 100%);
            overflow: hidden;
            position: relative;
            z-index: 25;
        }

        #screen-letter::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.75) 0%, transparent 35%),
                radial-gradient(circle at 90% 30%, rgba(255, 220, 230, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 50% 85%, rgba(255, 240, 245, 0.7) 0%, transparent 45%);
            pointer-events: none;
            z-index: 1;
        }

        .letter-scroll-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            scroll-behavior: auto;
            -webkit-overflow-scrolling: touch;
            z-index: 2;
        }

        .letter-scroll-viewport::-webkit-scrollbar {
            width: 8px;
        }

        .letter-scroll-viewport::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.35);
            border-radius: 10px;
        }

        .letter-scroll-viewport::-webkit-scrollbar-thumb {
            background: rgba(255, 117, 143, 0.5);
            border-radius: 10px;
        }

        .letter-scroll-viewport::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 77, 109, 0.8);
        }

        .letter-scroll-track {
            position: relative;
            width: 92%;
            max-width: 680px;
            margin: 0 auto;
            padding: 36px 0 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Trang giấy da hoàng gia cổ điển lộng lẫy */
        .letter-paper {
            background: linear-gradient(180deg, #ffffff 0%, #fff7f9 45%, #ffeff3 100%);
            border: 2px solid #ffd166;
            border-radius: 36px;
            padding: 50px 42px;
            box-shadow: 
                0 25px 70px rgba(225, 29, 72, 0.18),
                0 8px 30px rgba(190, 18, 60, 0.12),
                0 0 50px rgba(255, 209, 102, 0.35),
                inset 0 0 35px rgba(255, 255, 255, 0.8);
            color: #3b101d;
            position: relative;
            width: 100%;
        }

        /* Viền kép hoa văn chìm */
        .letter-paper::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            bottom: 14px;
            border: 1.5px dashed rgba(225, 29, 72, 0.45);
            border-radius: 26px;
            pointer-events: none;
        }

        /* Biểu tượng trái tim 💗 ở đầu bức thư */
        .letter-top-heart {
            font-size: 3.8rem;
            line-height: 1;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            animation: letterHeartPulse 2.4s infinite ease-in-out;
            filter: drop-shadow(0 6px 18px rgba(244, 114, 182, 0.45));
        }

        @keyframes letterHeartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        .letter-heading {
            font-family: var(--font-calligraphy);
            font-size: 3.6rem;
            color: #be123c;
            line-height: 1.15;
            margin-bottom: 26px;
            filter: drop-shadow(0 2px 8px rgba(190, 18, 60, 0.2));
        }

        .letter-body {
            font-family: var(--font-serif);
            font-size: 1.18rem;
            line-height: 2.25;
            color: #4a1525;
            text-align: justify;
            text-justify: inter-word;
            margin-bottom: 32px;
            white-space: pre-line;
            font-weight: 500;
        }

        .typing-cursor {
            display: inline-block;
            width: 2.5px;
            height: 1.2em;
            background: #be123c;
            margin-left: 3px;
            vertical-align: -2px;
            animation: cursorBlink 0.7s infinite;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .letter-signature {
            font-family: var(--font-script);
            font-size: 2.2rem;
            color: #be123c;
            font-weight: 700;
            margin-top: 24px;
            text-align: right;
            padding-right: 15px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .letter-signature.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Nút chuyển sang Quả Địa Cầu nằm trang nhã ở cuối bức thư */
        .letter-footer-action {
            margin-top: 36px;
            display: flex;
            justify-content: center;
            opacity: 0;
            transform: translateY(14px);
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .letter-footer-action.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .btn-to-globe-inline {
            background: linear-gradient(135deg, #ffd166 0%, #f59e0b 100%);
            color: #3b101d;
            font-family: var(--font-main);
            font-size: 1.05rem;
            font-weight: 700;
            padding: 13px 30px;
            border-radius: 40px;
            border: 2px solid #ffffff;
            cursor: pointer;
            box-shadow: 
                0 8px 25px rgba(245, 158, 11, 0.45),
                0 0 25px rgba(255, 209, 102, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.45;
            max-width: 92%;
            gap: 10px;
        }

        .btn-to-globe-inline:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 12px 30px rgba(245, 158, 11, 0.6),
                0 0 35px rgba(255, 209, 102, 0.6);
        }

        .btn-to-globe-inline:active {
            transform: scale(0.96);
        }

        /* ========================================================
           MÀN HÌNH 5: QUẢ ĐỊA CẦU 3D TRÊN BẦU TRỜI ĐÊM CÓ TRĂNG SÁNG
           ======================================================== */
        #screen-photo-globe {
            flex-direction: column;
            background: radial-gradient(ellipse at 80% 20%, #15264a 0%, #0c162f 35%, #050a18 70%, #02040c 100%);
            position: relative;
            overflow: hidden;
        }

        #screen-photo-globe::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 80% 22%, rgba(200, 230, 255, 0.22) 0%, transparent 40%),
                radial-gradient(circle at 20% 30%, rgba(45, 85, 160, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 75% 75%, rgba(70, 35, 120, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        #night-sky-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Vầng trăng tròn phát sáng lộng lẫy */
        .luminous-moon-container {
            position: absolute;
            top: 38px;
            right: 50px;
            width: 95px;
            height: 95px;
            pointer-events: none;
            z-index: 1;
        }

        .moon-halo-outer {
            position: absolute;
            top: -55px;
            left: -55px;
            width: 205px;
            height: 205px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 245, 255, 0.28) 0%, rgba(160, 210, 255, 0.12) 45%, transparent 70%);
            filter: blur(14px);
            animation: moonAuraPulse 6s infinite ease-in-out alternate;
        }

        .moon-halo-inner {
            position: absolute;
            top: -22px;
            left: -22px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, rgba(254, 240, 138, 0.32) 48%, transparent 75%);
            filter: blur(8px);
        }

        .luminous-moon {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fffef4 30%, #fef3c7 70%, #fde68a 100%);
            box-shadow: 
                0 0 25px rgba(255, 255, 255, 0.95),
                0 0 55px rgba(254, 240, 138, 0.8),
                0 0 95px rgba(186, 230, 253, 0.5),
                0 0 160px rgba(147, 197, 253, 0.35),
                inset -6px -6px 14px rgba(217, 119, 6, 0.22);
            overflow: hidden;
        }

        .moon-texture-crater {
            position: absolute;
            border-radius: 50%;
            background: rgba(217, 119, 6, 0.08);
            filter: blur(2px);
        }
        .moon-texture-crater.c1 {
            width: 36px;
            height: 36px;
            top: 20px;
            left: 18px;
        }
        .moon-texture-crater.c2 {
            width: 22px;
            height: 22px;
            top: 50px;
            left: 52px;
        }
        .moon-texture-crater.c3 {
            width: 16px;
            height: 16px;
            top: 16px;
            left: 56px;
        }

        @keyframes moonAuraPulse {
            0% { transform: scale(0.92); opacity: 0.75; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        #webgl-globe-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
            z-index: 2;
            cursor: grab;
        }

        @media (max-width: 768px) {
            .luminous-moon-container {
                top: 22px;
                right: 22px;
                width: 72px;
                height: 72px;
            }
        }

        #webgl-globe-canvas:active {
            cursor: grabbing;
        }

        .globe-ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 26px 20px 30px;
        }

        .globe-header {
            pointer-events: auto;
            text-align: center;
            background: rgba(18, 9, 31, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 36px;
            border-radius: 50px;
            border: 1.5px solid rgba(255, 209, 102, 0.45);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 77, 109, 0.35);
            animation: fadeInDown 0.8s ease;
            max-width: 650px;
        }

        .globe-title {
            font-family: var(--font-script);
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #ffd166 60%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            filter: drop-shadow(0 2px 15px rgba(255, 209, 102, 0.6));
            line-height: 1.2;
        }

        .globe-subtitle {
            font-size: 0.94rem;
            color: #ffe4e6;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Thanh điều khiển dưới quả địa cầu */
        .globe-actions {
            pointer-events: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            max-width: 620px;
        }

        .globe-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-family: var(--font-main);
            font-weight: 800;
            font-size: 0.96rem;
            padding: 13px 24px;
            border-radius: 40px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .globe-btn:hover {
            background: linear-gradient(135deg, #ff4d6d, #ffd166);
            border-color: #ffd166;
            color: #3b101d;
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 77, 109, 0.6);
        }

        .globe-btn:active {
            transform: scale(0.96);
        }

        /* ========================================================
           LIGHTBOX PHÓNG TO ẢNH TRÊN QUẢ ĐỊA CẦU (BẢO TÀNG NGHỆ THUẬT)
           ======================================================== */
        .photo-lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }

        .photo-lightbox.active {
            display: flex;
            animation: fadeInLightbox 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInLightbox {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .lightbox-card {
            background: linear-gradient(135deg, #fff5f7 0%, #ffe4e9 100%);
            border-radius: 32px;
            padding: 24px 22px 26px;
            max-width: 540px;
            max-height: 90vh;
            width: 92%;
            text-align: center;
            position: relative;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 50px rgba(255, 209, 102, 0.3);
            border: 2px solid #ffd166;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-close-btn {
            position: absolute;
            top: -16px;
            right: -16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ff4d6d;
            border: 2.5px solid #ffffff;
            color: #ffffff;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
            z-index: 10;
        }

        .lightbox-close-btn:hover {
            transform: scale(1.15) rotate(90deg);
            background: #be123c;
        }

        .lightbox-canvas-view {
            max-width: 100%;
            max-height: 68vh;
            width: auto;
            height: auto;
            border-radius: 20px;
            object-fit: contain;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        }

        .lightbox-text {
            font-family: var(--font-script);
            font-size: 2.1rem;
            color: #be123c;
            margin-top: 16px;
            font-weight: 700;
        }

           RESPONSIVE MOBILE CHO TẤT CẢ CÁC MÀN HÌNH
