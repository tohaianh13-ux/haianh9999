                    // widthSegments = 6, heightSegments = 6 tạo độ cong mượt mà theo đúng mặt cầu
                    const patchGeo = new THREE.SphereGeometry(
                        globeRadius,
                        6,
                        6,
                        phiStart,
                        phiLength,
                        thetaStart,
                        thetaLength
                    );

                    // Trọng tâm của mảnh ảnh trên mặt cầu
                    patchGeo.computeBoundingBox();
                    const patchCenter = new THREE.Vector3();
                    patchGeo.boundingBox.getCenter(patchCenter);

                    // Dịch chuyển tâm hình học về (0,0,0) của Mesh để xoay/thu phóng độc lập mượt mà
                    patchGeo.translate(-patchCenter.x, -patchCenter.y, -patchCenter.z);

                    // Vị trí đích khi lắp ghép hoàn chỉnh thành quả cầu
                    const targetPos = patchCenter.clone();
                    const targetQuat = new THREE.Quaternion(); // Identity (không xoay lệch)

                    // Vị trí xuất phát phân tán tự do trong không gian 3D (để tự bay vào gộp lại)
                    const scatterDist = 24 + Math.random() * 20;
                    const randDir = patchCenter.clone().normalize();
                    const randOffset = new THREE.Vector3(
                        (Math.random() - 0.5) * 1.4,
                        (Math.random() - 0.5) * 1.4,
                        (Math.random() - 0.5) * 1.4
                    );
                    const startPos = randDir.add(randOffset).normalize().multiplyScalar(scatterDist);

                    const startEuler = new THREE.Euler(
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2
                    );
                    const startQuat = new THREE.Quaternion().setFromEuler(startEuler);

                    const photoData = cachedPhotoData[tileIndex % cachedPhotoData.length];

                    const tileMat = new THREE.MeshBasicMaterial({
                        map: photoData.texture,
                        side: THREE.FrontSide
                    });

                    const tileMesh = new THREE.Mesh(patchGeo, tileMat);
                    tileMesh.position.copy(startPos);
                    tileMesh.quaternion.copy(startQuat);
                    tileMesh.scale.set(0.12, 0.12, 0.12);

                    tileMesh.userData = {
                        id: tileIndex,
                        title: photoData.title,
                        canvas: photoData.canvas,
                        startPos: startPos,
                        targetPos: targetPos,
                        startQuat: startQuat,
                        targetQuat: targetQuat,
                        stagger: (tileIndex / 76) * 0.28
                    };

                    photoTileMeshes.push(tileMesh);
                    photoSphereGroup.add(tileMesh);
                    tileIndex++;
                }
            }

            // Khởi động bầu trời đêm 2D đầy sao và vầng trăng sáng
            initNightSkyCanvas();

            // Bắt sự kiện tương tác chuột & cảm ứng
            canvas.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            canvas.addEventListener('touchstart', onTouchStart, { passive: false });
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            canvas.addEventListener('touchend', onTouchEnd, { passive: true });
            window.addEventListener('touchend', onPointerUp, { passive: true });

            canvas.addEventListener('click', onCanvasClick);

            // Vòng lặp Render 3D
            function animateGlobe(now) {
                globeAnimId = requestAnimationFrame(animateGlobe);

                // Hiệu ứng tự các bức ảnh gộp với nhau thành quả địa cầu
                if (isAssembling) {
                    const elapsed = now - assembleStartTime;
                    const globalT = Math.min(1.0, elapsed / assembleDuration);

                    photoTileMeshes.forEach(mesh => {
                        const { startPos, targetPos, startQuat, targetQuat, stagger } = mesh.userData;
                        const localT = Math.max(0, Math.min(1, (globalT - stagger) / (1 - stagger)));
                        // Ease out cubic
                        const ease = 1 - Math.pow(1 - localT, 3);

                        mesh.position.lerpVectors(startPos, targetPos, ease);
                        mesh.quaternion.slerpQuaternions(startQuat, targetQuat, ease);
                        const s = 0.12 + (1.0 - 0.12) * ease;
                        mesh.scale.set(s, s, s);
                    });

                    if (coreGlobe) {
                        const coreEase = 1 - Math.pow(1 - globalT, 3);
                        coreGlobe.scale.set(coreEase, coreEase, coreEase);
                    }

                    if (globalT >= 1.0) {
                        isAssembling = false;
                    }
                }

                // Tự động xoay địa cầu khi không thao tác
                if (isGlobeAutoSpin && !isDragging) {
                    photoSphereGroup.rotation.y += 0.0032;
                }

                // Quán tính vuốt xoay
                if (!isDragging) {
                    photoSphereGroup.rotation.y += rotationVelocity.y;
                    photoSphereGroup.rotation.x += rotationVelocity.x;
                    rotationVelocity.y *= 0.94;
                    rotationVelocity.x *= 0.94;
                }

                globeRenderer.render(globeScene, globeCamera);
            }
            animateGlobe(performance.now());

            window.addEventListener('resize', onGlobeResize);
        }

        // Kích hoạt hiệu ứng các bức ảnh tự bay vào gộp thành hình địa cầu
        function startGlobeAssembly() {
            if (!photoTileMeshes || photoTileMeshes.length === 0) return;
            isAssembling = true;
            assembleStartTime = performance.now();

            if (coreGlobe) {
                coreGlobe.scale.set(0.01, 0.01, 0.01);
            }

            photoTileMeshes.forEach(mesh => {
                mesh.position.copy(mesh.userData.startPos);
                mesh.quaternion.copy(mesh.userData.startQuat);
                mesh.scale.set(0.12, 0.12, 0.12);
            });
        }

        function onGlobeResize() {
            if (!globeCamera || !globeRenderer) return;
            updateCameraDistance();
            globeRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onPointerDown(e) {
            isDragging = true;
            hasDragged = false;
            pointerStartPosition = { x: e.clientX, y: e.clientY };
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onPointerMove(e) {
            if (!isDragging || !photoSphereGroup) return;
            const moveDist = Math.hypot(e.clientX - pointerStartPosition.x, e.clientY - pointerStartPosition.y);
            if (moveDist > 6) {
                hasDragged = true;
            }

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            rotationVelocity.y = deltaX * 0.0035;
            rotationVelocity.x = deltaY * 0.0035;

            photoSphereGroup.rotation.y += rotationVelocity.y;
            photoSphereGroup.rotation.x += rotationVelocity.x;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onTouchStart(e) {
            if (e.touches.length === 1) {
                isDragging = true;
                hasDragged = false;
                pointerStartPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }

        function onTouchMove(e) {
            if (!isDragging || !photoSphereGroup || e.touches.length !== 1) return;
            if (e.cancelable) e.preventDefault();
            const moveDist = Math.hypot(e.touches[0].clientX - pointerStartPosition.x, e.touches[0].clientY - pointerStartPosition.y);
            if (moveDist > 6) {
                hasDragged = true;
            }

            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            rotationVelocity.y = deltaX * 0.0045;
            rotationVelocity.x = deltaY * 0.0045;

            photoSphereGroup.rotation.y += rotationVelocity.y;
            photoSphereGroup.rotation.x += rotationVelocity.x;

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }

        function onTouchEnd(e) {
            if (!hasDragged && isDragging && e.changedTouches && e.changedTouches[0]) {
                const touch = e.changedTouches[0];
                onCanvasClick({ clientX: touch.clientX, clientY: touch.clientY });
            }
            isDragging = false;
        }

        function onPointerUp() {
            isDragging = false;
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onCanvasClick(e) {
            if (!globeCamera || !photoSphereGroup || hasDragged || isAssembling) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, globeCamera);
            const intersects = raycaster.intersectObjects(photoTileMeshes);

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                if (hit.userData && hit.userData.canvas) {
                    openPhotoLightbox(hit.userData);
                }
            }
        }

        const photoLightbox = document.getElementById('photoLightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCaption = document.getElementById('lightboxCaption');

        function openPhotoLightbox(data) {
            if (data.img && data.img.src) {
                lightboxImg.src = data.img.src;
            } else if (data.canvas) {
                lightboxImg.src = data.canvas.toDataURL();
            }
            lightboxCaption.innerText = data.title;
            photoLightbox.classList.add('active');
        }

        function closePhotoLightbox() {
            photoLightbox.classList.remove('active');
        }

        // Đã gỡ bỏ thanh nút bấm điều khiển theo yêu cầu để quả địa cầu hiển thị toàn màn hình tinh gọn
        const globeLoveBtn = document.getElementById('globeLoveBtn');
        if (globeLoveBtn) {
            globeLoveBtn.addEventListener('click', () => {});
        }
    </script>
</body>
</html>
