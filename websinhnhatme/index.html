    <script>
        /* ========================================================
           1. CẤU HÌNH & HỆ THỐNG ÂM THANH DU DƯƠNG
           ======================================================== */
        const TARGET_PASSCODE = "2610"; // Mật khẩu sinh nhật Mẹ

        // Web Audio API Synthesizer - Giai điệu Happy Birthday to You chuẩn hòa âm Piano
        class MelodySynthesizer {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.timer = null;
                // Chuỗi nốt Happy Birthday chuẩn quốc tế (G4, G4, A4, G4, C5, B4...)
                this.score = [
                    // Đoạn 1: Happy birthday to you
                    { freq: 392.00, dur: 0.38, chord: 130.81 }, // G4 + C3
                    { freq: 392.00, dur: 0.20, chord: null },   // G4
                    { freq: 440.00, dur: 0.55, chord: 164.81 }, // A4 + E3
                    { freq: 392.00, dur: 0.55, chord: null },   // G4
                    { freq: 523.25, dur: 0.55, chord: 196.00 }, // C5 + G3
                    { freq: 493.88, dur: 1.15, chord: 146.83 }, // B4 + D3

                    // Đoạn 2: Happy birthday to you
                    { freq: 392.00, dur: 0.38, chord: 98.00 },  // G4 + G2
                    { freq: 392.00, dur: 0.20, chord: null },   // G4
                    { freq: 440.00, dur: 0.55, chord: 146.83 }, // A4 + D3
                    { freq: 392.00, dur: 0.55, chord: null },   // G4
                    { freq: 587.33, dur: 0.55, chord: 196.00 }, // D5 + G3
                    { freq: 523.25, dur: 1.15, chord: 130.81 }, // C5 + C3

                    // Đoạn 3: Happy birthday dear Mother
                    { freq: 392.00, dur: 0.38, chord: 130.81 }, // G4 + C3
                    { freq: 392.00, dur: 0.20, chord: null },   // G4
                    { freq: 783.99, dur: 0.55, chord: 196.00 }, // G5 + G3
                    { freq: 659.25, dur: 0.55, chord: 164.81 }, // E5 + E3
                    { freq: 523.25, dur: 0.55, chord: 130.81 }, // C5 + C3
                    { freq: 493.88, dur: 0.55, chord: 110.00 }, // B4 + A2
                    { freq: 440.00, dur: 1.15, chord: 87.31 },  // A4 + F2

                    // Đoạn 4: Happy birthday to you
                    { freq: 698.46, dur: 0.38, chord: 87.31 },  // F5 + F2
                    { freq: 698.46, dur: 0.20, chord: null },   // F5
                    { freq: 659.25, dur: 0.55, chord: 130.81 }, // E5 + C3
                    { freq: 523.25, dur: 0.55, chord: 164.81 }, // C5 + E3
                    { freq: 587.33, dur: 0.55, chord: 98.00 },  // D5 + G2
                    { freq: 523.25, dur: 1.60, chord: 130.81 }  // C5 + C3
                ];
                this.index = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPianoVoice(freq, startTime, duration, volume = 0.2) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                // Dạng sóng hài hòa phong cách đàn Piano / Hộp nhạc
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);

                // Đường bao âm lượng (Envelope) ngân vang tự nhiên
                gain.gain.setValueAtTime(0.0001, startTime);
                gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(volume * 0.4, startTime + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration + 0.05);
            }

            playKeyBeep(freq = 523.25) {
                // Đã tắt tiếng tít theo yêu cầu
            }

            playCountdownBoom(number) {
                // Đã tắt âm thanh giả lập
            }

            playCelebrationFanfare() {
                // Đã tắt âm thanh giả lập để nghe trọn vẹn bài hát chính
            }

            startBgm() {
                this.init();
                if (this.isPlaying) return;
                this.isPlaying = true;

                const playNext = () => {
                    if (!this.isPlaying) return;
                    const now = this.ctx.currentTime;
                    const item = this.score[this.index % this.score.length];

                    // Phát nốt giai điệu chính
                    this.playPianoVoice(item.freq, now, item.dur * 1.2, 0.22);

                    // Hòa âm nốt bè trầm (Bass/Chords) nếu có
                    if (item.chord) {
                        this.playPianoVoice(item.chord, now, item.dur * 1.8, 0.15);
                    }

                    this.index++;
                    this.timer = setTimeout(playNext, item.dur * 1000);
                };
                playNext();
            }

            stopBgm() {
                this.isPlaying = false;
                clearTimeout(this.timer);
            }
        }

        const melody = new MelodySynthesizer();
        const extMusic = document.getElementById('externalMusic');
        let isMusicPlaying = false;

        function toggleMusic() {
            if (!isMusicPlaying) {
                const promise = extMusic.play();
                if (promise !== undefined) {
                    promise.then(() => {
                        isMusicPlaying = true;
                    }).catch(() => {
                        melody.startBgm();
                        isMusicPlaying = true;
                    });
                }
            } else {
                extMusic.pause();
                melody.stopBgm();
                isMusicPlaying = false;
            }
        }

        /* ========================================================
           2. QUẢN LÝ CHUYỂN ĐỔI CÁC MÀN HÌNH (SCREENS)
           ======================================================== */
        function switchScreen(fromId, toId, delay = 0) {
            setTimeout(() => {
                const fromEl = document.getElementById(fromId);
                const toEl = document.getElementById(toId);
                if (fromEl) {
                    fromEl.classList.remove('active');
                }
                if (toEl) {
                    toEl.classList.add('active');
                }
            }, delay);
        }

        /* ========================================================
           3. MÀN HÌNH 1: XỬ LÝ MẬT KHẨU 2610
           ======================================================== */
        let currentInput = "";
        const dots = document.querySelectorAll('#passcodeDots .dot');
        const passcodeCardEl = document.querySelector('.passcode-card');

        function triggerCardPulse() {
            if (passcodeCardEl) {
                passcodeCardEl.classList.remove('card-pulse');
                void passcodeCardEl.offsetWidth; // Force reflow để chạy lại animation mượt mà
                passcodeCardEl.classList.add('card-pulse');
                clearTimeout(passcodeCardEl._pulseTimer);
                passcodeCardEl._pulseTimer = setTimeout(() => {
                    passcodeCardEl.classList.remove('card-pulse');
                }, 320);
            }
        }

        function updateDots() {
            dots.forEach((dot, idx) => {
                if (idx < currentInput.length) {
                    dot.classList.add('filled');
                    dot.classList.remove('error');
                } else {
                    dot.classList.remove('filled');
                    dot.classList.remove('error');
                    dot.classList.remove('correct');
                }
            });
        }

        function handleKeypadInput(key) {
            if (!isMusicPlaying) {
                toggleMusic();
            }

            // Kích hoạt hiệu ứng bảng số bừng sáng rực rỡ đổi màu hòa quyện với background
            triggerCardPulse();

            if (key === 'clear') {
                currentInput = "";
                updateDots();
                return;
            }
            if (key === 'backspace') {
                currentInput = currentInput.slice(0, -1);
                updateDots();
                return;
            }

            if (currentInput.length < 4) {
                currentInput += key;
                updateDots();

                if (currentInput.length === 4) {
                    checkPasscode();
                }
            }
        }

        function checkPasscode() {
            if (currentInput === TARGET_PASSCODE) {
                // Mật khẩu đúng!
                melody.playCelebrationFanfare();
                if (!isMusicPlaying) toggleMusic();

                dots.forEach(d => {
                    d.classList.remove('error');
                    d.classList.add('correct');
                });

                setTimeout(() => {
                    startCountdownSequence();
                }, 500);
            } else {
                // Sai mật khẩu
                dots.forEach(d => d.classList.add('error'));
                setTimeout(() => {
                    currentInput = "";
                    updateDots();
                }, 550);
            }
        }

        // Bắt sự kiện bàn phím trên giao diện
        document.querySelectorAll('#keypad .key-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.getAttribute('data-key');
                handleKeypadInput(key);
            });
        });

        // Hỗ trợ gõ từ bàn phím máy tính
        window.addEventListener('keydown', (e) => {
            const activeScreen = document.querySelector('.screen.active');
            if (activeScreen && activeScreen.id === 'screen-passcode') {
                if (e.key >= '0' && e.key <= '9') {
                    handleKeypadInput(e.key);
                    const btn = document.querySelector(`#keypad .key-btn[data-key="${e.key}"]`);
                    if (btn) {
                        btn.classList.add('active');
                        setTimeout(() => btn.classList.remove('active'), 200);
                    }
                } else if (e.key === 'Backspace') {
                    handleKeypadInput('backspace');
                    const btn = document.querySelector('#keypad .key-btn[data-key="backspace"]');
                    if (btn) {
                        btn.classList.add('active');
                        setTimeout(() => btn.classList.remove('active'), 200);
                    }
                } else if (e.key === 'Escape') {
                    handleKeypadInput('clear');
                    const btn = document.querySelector('#keypad .key-btn[data-key="clear"]');
                    if (btn) {
                        btn.classList.add('active');
                        setTimeout(() => btn.classList.remove('active'), 200);
                    }
                }
            }
        });

        /* ========================================================
           4. MÀN HÌNH 2: ĐẾM NGƯỢC 4 3 2 1
           ======================================================== */
        function startCountdownSequence() {
            switchScreen('screen-passcode', 'screen-countdown');
            let count = 4;
            const countNumEl = document.getElementById('countdownNumber');

            function nextCount() {
                if (count > 0) {
                    countNumEl.style.animation = 'none';
                    countNumEl.offsetHeight; // reflow
                    countNumEl.innerText = count;
                    countNumEl.style.animation = 'countZoom 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                    melody.playCountdownBoom(count);
                    count--;
                    setTimeout(nextCount, 950);
                } else {
                    // Xong đếm ngược -> Bùng nổ bánh kem 3D!
                    melody.playCelebrationFanfare();
                    switchScreen('screen-countdown', 'screen-cake-3d');
                    initCake3DScene();
                    startCakeFireworks();
                }
            }
            setTimeout(nextCount, 300);
        }

        /* ========================================================
           5. MÀN HÌNH 3: BÁNH SINH NHẬT 3D TỪ TIA SÁNG + NẾN SIÊU MƯỢT
           ======================================================== */
        let cakeRenderer, cakeScene, cakeCamera;
        let cakeParticlesMesh, flameMeshes = [], smokeParticlesMesh;
        let cakeAnimId = null;
        let cakeInitialized = false;
        let candlesBlownOut = false;
        let cakeAssemblyProgress = 0;

        // Tạo texture hạt sáng lung linh qua canvas offscreen
        function createGlowPointTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 209, 102, 0.85)');
            grad.addColorStop(0.7, 'rgba(255, 77, 109, 0.45)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function updateCakeCameraDistance() {
            if (!cakeCamera) return;
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 1) {
                // Trên màn hình dọc điện thoại: camera lùi ra xa và hơi nâng cao để thấy trọn vẹn cả 3 tầng bánh và các cây nến
                cakeCamera.position.set(0, 8.5, Math.max(26, 15.2 / aspect));
            } else {
                cakeCamera.position.set(0, 8, 22);
            }
            cakeCamera.aspect = aspect;
            cakeCamera.updateProjectionMatrix();
        }

        function initCake3DScene() {
            if (cakeInitialized) {
                updateCakeCameraDistance();
                return;
            }
            cakeInitialized = true;

            const canvas = document.getElementById('webgl-cake-canvas');

            cakeScene = new THREE.Scene();
            cakeCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCakeCameraDistance();
            cakeCamera.lookAt(0, 1.5, 0);

            cakeRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            cakeRenderer.setSize(window.innerWidth, window.innerHeight);
            cakeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Ambient Light
            const ambLight = new THREE.AmbientLight(0xffebee, 0.85);
            cakeScene.add(ambLight);

            // TẠO HÀNG NGÀN HẠT TIA SÁNG ĐỂ TẠO NÊN BÁNH SINH NHẬT 3 TẦNG
            const glowTex = createGlowPointTexture();
            const particleCount = 4500;
            const targetPositions = new Float32Array(particleCount * 3);
            const currentPositions = new Float32Array(particleCount * 3);
            const particleColors = new Float32Array(particleCount * 3);

            let pIdx = 0;

            function addTierParticles(tierY, radius, height, colorArr, count) {
                for (let i = 0; i < count; i++) {
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * Math.PI * 2;
                    let r, y;

                    if (v < 0.65) {
                        r = radius + (Math.random() - 0.5) * 0.25;
                        y = tierY + (Math.random() - 0.5) * height;
                    } else {
                        r = Math.sqrt(Math.random()) * radius;
                        y = tierY + height / 2;
                    }

                    const x = Math.cos(theta) * r;
                    const z = Math.sin(theta) * r;

                    targetPositions[pIdx * 3] = x;
                    targetPositions[pIdx * 3 + 1] = y;
                    targetPositions[pIdx * 3 + 2] = z;

                    const angle = Math.random() * Math.PI * 2;
                    const dist = 25 + Math.random() * 20;
                    currentPositions[pIdx * 3] = Math.cos(angle) * dist;
                    currentPositions[pIdx * 3 + 1] = (Math.random() - 0.5) * 35;
                    currentPositions[pIdx * 3 + 2] = Math.sin(angle) * dist;

                    particleColors[pIdx * 3] = colorArr[0];
                    particleColors[pIdx * 3 + 1] = colorArr[1];
                    particleColors[pIdx * 3 + 2] = colorArr[2];

                    pIdx++;
                }
            }

            // Tầng 1 (đáy): Hồng nhung & Vàng kim (R: 5.5, H: 2.4)
            addTierParticles(-1.2, 5.5, 2.4, [1.0, 0.35, 0.5], 1600);
            // Tầng 2 (giữa): Kem dâu ngọt ngào (R: 3.8, H: 2.0)
            addTierParticles(1.0, 3.8, 2.0, [1.0, 0.7, 0.8], 1300);
            // Tầng 3 (trên): Vàng hoàng gia & Trắng tuyết (R: 2.3, H: 1.6)
            addTierParticles(2.8, 2.3, 1.6, [1.0, 0.85, 0.4], 1000);

            // Bổ sung hạt viền kem lượn sóng (Cream Swirls)
            for (let i = 0; i < 600; i++) {
                const theta = (i / 600) * Math.PI * 2 * 6;
                const r = 2.4 + Math.sin(theta * 3) * 0.2;
                const x = Math.cos(theta) * r;
                const z = Math.sin(theta) * r;
                const y = 3.6 + Math.cos(theta * 6) * 0.15;

                targetPositions[pIdx * 3] = x;
                targetPositions[pIdx * 3 + 1] = y;
                targetPositions[pIdx * 3 + 2] = z;

                currentPositions[pIdx * 3] = (Math.random() - 0.5) * 40;
                currentPositions[pIdx * 3 + 1] = (Math.random() - 0.5) * 40;
                currentPositions[pIdx * 3 + 2] = (Math.random() - 0.5) * 40;

                particleColors[pIdx * 3] = 1.0;
                particleColors[pIdx * 3 + 1] = 0.95;
                particleColors[pIdx * 3 + 2] = 0.8;
                pIdx++;
            }

            const cakeGeo = new THREE.BufferGeometry();
            cakeGeo.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            cakeGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

            const cakeMat = new THREE.PointsMaterial({
                size: 0.45,
                map: glowTex,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                vertexColors: true
            });

            cakeParticlesMesh = new THREE.Points(cakeGeo, cakeMat);
            cakeScene.add(cakeParticlesMesh);

            // TẠO CÁC CÂY NẾN NHỎ MẢNH MAI & ĐẦU NẾN 3D CHÂN THỰC
            const candleCoords = [
                { x: 0, z: 0 },
                { x: -1.0, z: -0.6 },
                { x: 1.0, z: -0.6 },
                { x: -0.7, z: 0.8 },
                { x: 0.7, z: 0.8 }
            ];

            // Tạo texture hào quang cho ngọn lửa
            function createFlameHaloTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
                grad.addColorStop(0, 'rgba(255, 252, 235, 1)');
                grad.addColorStop(0.18, 'rgba(255, 195, 55, 0.85)');
                grad.addColorStop(0.45, 'rgba(255, 105, 20, 0.4)');
                grad.addColorStop(0.75, 'rgba(255, 45, 0, 0.1)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 128, 128);
                return new THREE.CanvasTexture(canvas);
            }
            const flameHaloTex = createFlameHaloTexture();
            const flameHaloMat = new THREE.SpriteMaterial({
                map: flameHaloTex,
                transparent: true,
                opacity: 0.88,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            // Tạo hình khối giọt lửa (Teardrop Mesh) tự nhiên chân thực
            const flamePoints = [];
            for (let i = 0; i <= 24; i++) {
                const t = (i / 24) * Math.PI;
                const y = (1.0 - Math.cos(t)) * 0.44;
                const r = Math.sin(t) * Math.pow(1.0 - (i / 24), 0.55) * 0.22;
                flamePoints.push(new THREE.Vector2(Math.max(0, r), y));
            }
            const flameOuterGeo = new THREE.LatheGeometry(flamePoints, 24);

            const corePoints = flamePoints.map(p => new THREE.Vector2(p.x * 0.58, p.y * 0.8));
            const flameCoreGeo = new THREE.LatheGeometry(corePoints, 24);

            const blueBaseGeo = new THREE.SphereGeometry(0.075, 16, 12);
            blueBaseGeo.scale(1, 0.45, 1);

            const flameOuterMat = new THREE.MeshBasicMaterial({
                color: 0xff6b00,
                transparent: true,
                opacity: 0.82,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const flameCoreMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.96,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const blueBaseMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            // Chiều rộng cây nến bé lại (R: 0.065, H: 1.45) thanh nhã
            const candleGeo = new THREE.CylinderGeometry(0.065, 0.065, 1.45, 24);
            const candleMat = new THREE.MeshStandardMaterial({
                color: 0xfffaf0,
                roughness: 0.25,
                metalness: 0.05
            });

            const wickGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.25, 8);
            const wickMat = new THREE.MeshBasicMaterial({ color: 0x222222 });

            const clickableCandleObjects = [];

            candleCoords.forEach((coord, cIdx) => {
                // Thân cây nến nhỏ gọn
                const candleMesh = new THREE.Mesh(candleGeo, candleMat);
                candleMesh.position.set(coord.x, 4.3, coord.z);
                cakeScene.add(candleMesh);
                clickableCandleObjects.push(candleMesh);

                // Tim nến
                const wick = new THREE.Mesh(wickGeo, wickMat);
                wick.position.set(coord.x, 5.12, coord.z);
                cakeScene.add(wick);
                clickableCandleObjects.push(wick);

                // Nhóm ngọn lửa 3D đa lớp chân thực
                const flameGroup = new THREE.Group();
                flameGroup.position.set(coord.x, 5.22, coord.z);

                const outerMesh = new THREE.Mesh(flameOuterGeo, flameOuterMat.clone());
                flameGroup.add(outerMesh);
                clickableCandleObjects.push(outerMesh);

                const coreMesh = new THREE.Mesh(flameCoreGeo, flameCoreMat.clone());
                coreMesh.position.y = 0.02;
                flameGroup.add(coreMesh);

                const blueMesh = new THREE.Mesh(blueBaseGeo, blueBaseMat.clone());
                blueMesh.position.y = 0.03;
                flameGroup.add(blueMesh);

                const haloSprite = new THREE.Sprite(flameHaloMat.clone());
                haloSprite.position.y = 0.42;
                haloSprite.scale.set(1.6, 1.6, 1.0);
                flameGroup.add(haloSprite);

                cakeScene.add(flameGroup);

                // Nguồn sáng ấm bập bùng từ mỗi ngọn nến
                const light = new THREE.PointLight(0xff9900, 1.35, 9);
                light.position.set(coord.x, 5.5, coord.z);
                cakeScene.add(light);

                flameMeshes.push({
                    group: flameGroup,
                    outerMesh: outerMesh,
                    coreMesh: coreMesh,
                    haloSprite: haloSprite,
                    light: light,
                    baseX: coord.x,
                    baseY: 5.22,
                    baseZ: coord.z
                });
            });

            // TẠO HẠT KHÓI KHI THỔI NẾN
            const smokeCount = 120;
            const smokePos = new Float32Array(smokeCount * 3);
            for (let i = 0; i < smokeCount; i++) {
                smokePos[i * 3] = 0;
                smokePos[i * 3 + 1] = -100;
                smokePos[i * 3 + 2] = 0;
            }
            const smokeGeo = new THREE.BufferGeometry();
            smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
            const smokeMat = new THREE.PointsMaterial({
                size: 0.65,
                color: 0xd1d5db,
                transparent: true,
                opacity: 0.0,
                blending: THREE.NormalBlending
            });
            smokeParticlesMesh = new THREE.Points(smokeGeo, smokeMat);
            cakeScene.add(smokeParticlesMesh);

            // BẮT SỰ KIỆN CLICK / CHẠM VÀO CÂY NẾN ĐỂ THỔI NẾN
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            function handleCandlePointer(event) {
                if (candlesBlownOut) return;
                const rect = canvas.getBoundingClientRect();
                const clientX = event.clientX || (event.touches && event.touches[0] ? event.touches[0].clientX : 0);
                const clientY = event.clientY || (event.touches && event.touches[0] ? event.touches[0].clientY : 0);
                mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, cakeCamera);
                const intersects = raycaster.intersectObjects(clickableCandleObjects, true);

                // Chạm trúng nến/ngọn lửa hoặc chạm vào khu vực bánh sinh nhật
                if (intersects.length > 0 || (mouse.y > -0.25 && mouse.y < 0.85 && Math.abs(mouse.x) < 0.65)) {
                    blowCandlesOut();
                }
            }

            canvas.addEventListener('click', handleCandlePointer);
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches[0]) handleCandlePointer(e.touches[0]);
            }, { passive: true });

            canvas.addEventListener('mousemove', (e) => {
                if (candlesBlownOut) {
                    canvas.style.cursor = 'default';
                    return;
                }
                const rect = canvas.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, cakeCamera);
                const hits = raycaster.intersectObjects(clickableCandleObjects, true);
                if (hits.length > 0 || (mouse.y > 0.08 && mouse.y < 0.75 && Math.abs(mouse.x) < 0.48)) {
                    canvas.style.cursor = 'pointer';
                } else {
                    canvas.style.cursor = 'default';
                }
            });

            let clock = new THREE.Clock();

            function animateCake() {
                cakeAnimId = requestAnimationFrame(animateCake);
                const delta = clock.getDelta();
                const elapsedTime = clock.getElapsedTime();

                // Hiệu ứng tụ hội các tia sáng thành bánh sinh nhật mượt mà
                if (cakeAssemblyProgress < 1.0) {
                    cakeAssemblyProgress += delta * 0.55;
                    const t = Math.min(cakeAssemblyProgress, 1.0);
                    const ease = 1 - Math.pow(1 - t, 3);
                    const posAttr = cakeParticlesMesh.geometry.attributes.position;
                    for (let i = 0; i < particleCount; i++) {
                        const targetX = targetPositions[i * 3];
                        const targetY = targetPositions[i * 3 + 1];
                        const targetZ = targetPositions[i * 3 + 2];

                        const startX = currentPositions[i * 3];
                        const startY = currentPositions[i * 3 + 1];
                        const startZ = currentPositions[i * 3 + 2];

                        posAttr.array[i * 3] = startX + (targetX - startX) * ease;
                        posAttr.array[i * 3 + 1] = startY + (targetY - startY) * ease;
                        posAttr.array[i * 3 + 2] = startZ + (targetZ - startZ) * ease;
                    }
                    posAttr.needsUpdate = true;
                }

                cakeScene.rotation.y = elapsedTime * 0.25;

                // Hiệu ứng bập bùng, rung rinh chân thực của 5 ngọn nến
                if (!candlesBlownOut) {
                    flameMeshes.forEach((item, idx) => {
                        const t = elapsedTime;
                        const windZ = Math.sin(t * 12 + idx * 2.5) * 0.08 + Math.cos(t * 26 + idx) * 0.03;
                        const windX = Math.cos(t * 10 + idx * 3.1) * 0.06;
                        const stretch = Math.sin(t * 16 + idx * 4.1) * 0.08 + Math.cos(t * 32) * 0.04;

                        item.group.rotation.z = windZ;
                        item.group.rotation.x = windX;
                        item.outerMesh.scale.set(1.0 - stretch * 0.3, 1.0 + stretch, 1.0 - stretch * 0.3);
                        item.coreMesh.scale.set(1.0 - stretch * 0.25, 1.0 + stretch * 0.8, 1.0 - stretch * 0.25);
                        item.haloSprite.scale.set(1.6 + stretch * 0.3, 1.6 + stretch * 0.3, 1.0);
                        item.light.intensity = 1.2 + Math.sin(t * 14 + idx) * 0.35 + Math.sin(t * 28 + idx * 2) * 0.15;
                    });
                } else {
                    const sPos = smokeParticlesMesh.geometry.attributes.position;
                    for (let i = 0; i < smokeCount; i++) {
                        if (sPos.array[i * 3 + 1] > -50) {
                            sPos.array[i * 3 + 1] += delta * 2.2;
                            sPos.array[i * 3] += Math.sin(elapsedTime * 4 + i) * 0.02;
                        }
                    }
                    sPos.needsUpdate = true;
                }

                cakeRenderer.render(cakeScene, cakeCamera);
            }
            animateCake();

            window.addEventListener('resize', onCakeResize);
            startCakeFireworks();
        }

        function onCakeResize() {
            if (!cakeCamera || !cakeRenderer) return;
            updateCakeCameraDistance();
            cakeRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        // HÀM THỔI NẾN VÀ KÍCH HOẠT LÁ THƯ 💌 TRÔI LÊN
        function blowCandlesOut() {
            if (candlesBlownOut) return;
            candlesBlownOut = true;

            melody.playCelebrationFanfare();

            // Đại tiệc pháo hoa bùng nổ chúc mừng sinh nhật Mẹ (Trái tim, Bông hoa, Pháo hoa tỏa sáng)
            triggerCakeFireworksFinale();

            // Dập tắt ngọn lửa & tắt đèn nến
            flameMeshes.forEach(item => {
                item.group.visible = false;
                item.light.intensity = 0;
            });

            // Tỏa làn khói thơm từ các tim nến
            if (smokeParticlesMesh) {
                smokeParticlesMesh.material.opacity = 0.75;
                const sPos = smokeParticlesMesh.geometry.attributes.position;
                flameMeshes.forEach((item, idx) => {
                    for (let j = 0; j < 24; j++) {
                        const sIdx = (idx * 24 + j);
                        sPos.array[sIdx * 3] = item.baseX + (Math.random() - 0.5) * 0.15;
                        sPos.array[sIdx * 3 + 1] = 5.15 + Math.random() * 0.4;
                        sPos.array[sIdx * 3 + 2] = item.baseZ + (Math.random() - 0.5) * 0.15;
                    }
                });
                sPos.needsUpdate = true;
            }

            // Lá thư 💌 từ từ trôi lên tới phần đáy bánh và dừng lại
            setTimeout(() => {
                const envWrapper = document.getElementById('floatingEnvelopeWrapper');
                if (envWrapper) {
                    if (cakeCamera) {
                        // Tính chính xác vị trí phần đáy bánh kem 3D trên màn hình
                        const v = new THREE.Vector3(0, -2.4, 4.8);
                        v.project(cakeCamera);
                        const bottomPx = Math.round(Math.max(85, Math.min(window.innerHeight * 0.35, (v.y + 1) / 2 * window.innerHeight - 30)));
                        envWrapper.style.bottom = `${bottomPx}px`;
                    }
                    envWrapper.classList.add('visible');
                }
            }, 450);
        }

        // BẤM VÀO LÁ THƯ 💌 ĐỂ HIỆN RA BỨC THƯ TAY
        function openLetterFromEnvelope(e) {
            if (e) {
                e.stopPropagation();
            }
            melody.playCelebrationFanfare();
            stopCakeFireworks();
            switchScreen('screen-cake-3d', 'screen-letter');
            startLetterTyping();
        }

        const envelopeCardBtn = document.getElementById('envelopeCard');
        if (envelopeCardBtn) {
            envelopeCardBtn.addEventListener('click', openLetterFromEnvelope);
            envelopeCardBtn.addEventListener('touchend', openLetterFromEnvelope);
        }

        /* ========================================================
           HỆ THỐNG PHÁO HOA TRÁI TIM BẮN THẲNG LÊN TRỜI
           (Pháo hoa bắn lên từ 2 bên ngoài bánh kem với HIỆU ỨNG TRÁI TIM ❤️ lộng lẫy)
           ======================================================== */
        let fwCanvas = null;
        let fwCtx = null;
        let fwAnimId = null;
        let fwRockets = [];
        let fwBlooms = [];
        let fwRocketSparks = [];
        let fwWillowSparks = [];
        let fwSkyFlashes = [];
        let fwLaunchTimer = null;
        let fwIsRunning = false;
        let fwFlankToggle = 'left'; // Luân phiên bắn ở 2 bên rìa ngoài bánh sinh nhật

        // Bảng màu phong phú, đủ các sắc màu rực rỡ cho pháo hoa trái tim
        const FW_COLORS = [
            { name: 'đỏ ruby',       hex: '#ff2d55', r: 255, g: 45,  b: 85  }, // Đỏ nồng thắm yêu thương
            { name: 'hồng ngọt ngào',hex: '#ff66a3', r: 255, g: 102, b: 163 }, // Hồng dịu ngọt tình mẹ
            { name: 'vàng hoàng gia',hex: '#ffd166', r: 255, g: 209, b: 102 }, // Vàng kim ấm áp
            { name: 'tím thạch anh', hex: '#c084fc', r: 192, g: 132, b: 252 }, // Tím mộng mơ quý phái
            { name: 'xanh lam ngọc', hex: '#38bdf8', r: 56,  g: 189, b: 248 }, // Xanh hy vọng trong trẻo
            { name: 'xanh ngọc bích',hex: '#2dd4bf', r: 45,  g: 212, b: 191 }, // Xanh mint thanh khiết
            { name: 'cam san hô',    hex: '#fb923c', r: 251, g: 146, b: 60  }, // Cam rực rỡ ấm lòng
            { name: 'trắng pha lê',  hex: '#fff0db', r: 255, g: 240, b: 219 }  // Trắng ánh sâm-panh thuần khiết
        ];
        let fwColorIndex = 0;

        // Tọa độ chuẩn hóa của đường cong hình Trái Tim Cardioid (tính toán 1 lần)
        const FW_HEART_COORDS = [];
        const FW_TOTAL_HEART_PTS = 64;

        for (let i = 0; i < FW_TOTAL_HEART_PTS; i++) {
            const t = (i / FW_TOTAL_HEART_PTS) * Math.PI * 2;
            const sinT = Math.sin(t);
            const normX = Math.pow(sinT, 3);
            const normY = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17;
            FW_HEART_COORDS.push({ x: normX, y: normY });
        }

        function initCakeFireworksCanvas() {
            fwCanvas = document.getElementById('cake-fireworks-canvas');
            if (!fwCanvas) return;
            fwCtx = fwCanvas.getContext('2d');
            resizeCakeFireworks();
            window.removeEventListener('resize', resizeCakeFireworks);
            window.addEventListener('resize', resizeCakeFireworks);
        }

        function resizeCakeFireworks() {
            if (!fwCanvas) return;
            const dpr = window.devicePixelRatio || 1;
            fwCanvas.width = window.innerWidth * dpr;
            fwCanvas.height = window.innerHeight * dpr;
        }

        // Tàn lửa rơi sau đuôi quả pháo đang bay vút lên cao
        class RocketSpark {
            constructor(x, y, vx, vy, colorHex) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = colorHex;
                this.alpha = 0.9;
                this.decay = Math.random() * 0.05 + 0.04;
                this.size = Math.random() * 1.3 + 0.8;
                this.dead = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                if (this.alpha <= 0) this.dead = true;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.alpha * 0.7);
                ctx.fill();
            }
        }

        // Tàn kim tuyến hoa liễu rơi nhẹ từ viền trái tim (hiệu ứng pháo hoa hoa liễu)
        class WillowSpark {
            constructor(x, y, colorHex) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = Math.random() * 0.85 + 0.35;
                this.gravity = 0.036;
                this.color = colorHex;
                this.alpha = 0.88;
                this.decay = Math.random() * 0.026 + 0.018;
                this.size = Math.random() * 0.9 + 0.6;
                this.dead = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= this.decay;
                if (this.alpha <= 0) this.dead = true;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.alpha * 0.65);
                ctx.fill();
            }
        }

        // Quả pháo phóng thẳng đứng từ dưới đáy màn hình lên bầu trời
        class FireworkRocket {
            constructor(startX, targetY, shape, colorObj) {
                const w = window.innerWidth;
                const h = window.innerHeight;

                if (startX !== undefined) {
                    this.x = startX;
                } else {
                    // Bắn lên ở bên ngoài 2 bên bánh sinh nhật (luân phiên trái & phải, không che bánh ở giữa)
                    fwFlankToggle = (fwFlankToggle === 'left') ? 'right' : 'left';
                    if (fwFlankToggle === 'left') {
                        // Bên ngoài cánh trái của bánh sinh nhật (6% - 24% màn hình)
                        this.x = w * (0.06 + Math.random() * 0.18);
                    } else {
                        // Bên ngoài cánh phải của bánh sinh nhật (76% - 94% màn hình)
                        this.x = w * (0.76 + Math.random() * 0.18);
                    }
                }
                this.y = h + 15;
                this.targetY = (targetY !== undefined) ? targetY : (h * (0.15 + Math.random() * 0.22));

                // Mỗi quả pháo mang đúng 1 màu rực rỡ thuần khiết trong bảng màu phong phú
                this.color = colorObj || FW_COLORS[(fwColorIndex++) % FW_COLORS.length];

                // Vận tốc bay vút lên êm dịu, chậm rãi hơn 1 xíu để ngắm rõ tia pháo bay lên
                this.vx = (Math.random() - 0.5) * 0.08;
                const distance = Math.max(80, this.y - this.targetY);
                this.gravity = 0.35;
                this.vy = -(Math.sqrt(2 * this.gravity * distance) * 1.02);

                this.dead = false;
                this.history = [];
            }

            update() {
                this.history.unshift([this.x, this.y]);
                if (this.history.length > 7) this.history.pop();

                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;

                // Thả vệt tàn lửa sáng rực sau đuôi pháo
                fwRocketSparks.push(new RocketSpark(
                    this.x + (Math.random() - 0.5) * 2,
                    this.y + Math.random() * 3,
                    (Math.random() - 0.5) * 0.3,
                    Math.random() * 1.1 + 0.4,
                    this.color.hex
                ));

                // Chạm tới đỉnh độ cao -> Nở bùng ra HIỆU ỨNG TRÁI TIM ❤️ lộng lẫy
                if (this.y <= this.targetY || this.vy >= -0.6) {
                    this.dead = true;
                    this.explode();
                }
            }

            explode() {
                // Ánh chớp bầu trời cực nhẹ dịu mang đúng màu sắc quả pháo
                fwSkyFlashes.push({
                    x: this.x,
                    y: this.y,
                    r: this.color.r,
                    g: this.color.g,
                    b: this.color.b,
                    radius: 135,
                    alpha: 0.12,
                    decay: 0.015
                });

                // Nở bùng ra khối pháo hoa HIỆU ỨNG TRÁI TIM
                fwBlooms.push(new HeartFireworkBloom(this.x, this.y, this.color));
            }

            draw(ctx) {
                // Vệt sáng quả pháo phóng vút lên
                if (this.history.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.history[this.history.length - 1][0], this.history[this.history.length - 1][1]);
                    for (let i = this.history.length - 2; i >= 0; i--) {
                        ctx.lineTo(this.history[i][0], this.history[i][1]);
                    }
                    ctx.lineTo(this.x, this.y);
                    ctx.strokeStyle = this.color.hex;
                    ctx.globalAlpha = 0.65;
                    ctx.lineWidth = 1.6;
                    ctx.stroke();
                }

                // Đầu quả pháo sáng chói
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.0, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = 1.0;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, 3.2, 0, Math.PI * 2);
                ctx.fillStyle = this.color.hex;
                ctx.globalAlpha = 0.5;
                ctx.fill();
            }
        }

        // KHỐI PHÁO HOA HIỆU ỨNG TRÁI TIM: NỞ RA VÀ GIỮ TRỌN HÌNH TRÁI TIM LẤP LÁNH KIM TUYẾN
        class HeartFireworkBloom {
            constructor(x, y, colorObj) {
                this.x = x;
                this.y = y;
                this.color = colorObj;

                const baseDim = Math.min(window.innerWidth, window.innerHeight);
                this.targetRadius = Math.max(38, Math.min(76, baseDim * (0.082 + Math.random() * 0.020)));
                this.currentRadius = 0;

                this.state = 'bursting'; // 'bursting' -> 'shimmering' -> 'fading'
                this.burstProgress = 0; // Từ 0 đến 1 trong 8 frames (~0.13s nở bung nhanh)
                this.shimmerFrames = 0;
                this.maxShimmerFrames = 68; // Tỏa sáng lung linh ngắm trọn vẹn ~1.15s
                this.alpha = 1.0;
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.dead = false;

                // 64 hạt pháo hoa lấp lánh dọc viền trái tim (giữ nguyên hình dạng, không bị tán loạn)
                this.sparks = [];
                for (let i = 0; i < FW_TOTAL_HEART_PTS; i++) {
                    const pt = FW_HEART_COORDS[i];
                    this.sparks.push({
                        normX: pt.x,
                        normY: pt.y,
                        size: Math.random() * 0.8 + 1.5,
                        phase: Math.random() * Math.PI * 2,
                        speed: Math.random() * 0.12 + 0.08
                    });
                }

                // 18 vì sao lung linh trong lòng trái tim (cùng chuyển động, không tách rời)
                this.innerStars = [];
                for (let j = 0; j < 18; j++) {
                    const t = Math.random() * Math.PI * 2;
                    const sinT = Math.sin(t);
                    const normX = Math.pow(sinT, 3);
                    const normY = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17;
                    const scale = Math.random() * 0.65 + 0.15;
                    this.innerStars.push({
                        relX: normX * scale,
                        relY: normY * scale,
                        size: Math.random() * 0.8 + 0.8,
                        phase: Math.random() * Math.PI * 2,
                        speed: Math.random() * 0.10 + 0.05
                    });
                }
            }

            update() {
                if (this.state === 'bursting') {
                    this.burstProgress += 0.125;
                    // Đường cong nở bung êm ái (ease-out)
                    this.currentRadius = this.targetRadius * Math.sin((this.burstProgress * Math.PI) / 2);
                    if (this.burstProgress >= 1.0) {
                        this.state = 'shimmering';
                        this.currentRadius = this.targetRadius;
                    }
                } else if (this.state === 'shimmering') {
                    // Trôi bồng bềnh rất nhẹ và đập nhịp tim êm ái
                    this.pulsePhase += 0.08;
                    const pulse = Math.sin(this.pulsePhase) * 0.045;
                    this.currentRadius = this.targetRadius * (1.0 + pulse);
                    this.y += 0.08;

                    // Thả tàn kim tuyến hoa liễu rơi nhẹ từ viền trái tim
                    if (Math.random() > 0.45) {
                        const randomIdx = Math.floor(Math.random() * FW_TOTAL_HEART_PTS);
                        const pt = FW_HEART_COORDS[randomIdx];
                        const sparkX = this.x + pt.x * this.currentRadius;
                        const sparkY = this.y + pt.y * this.currentRadius;
                        fwWillowSparks.push(new WillowSpark(sparkX, sparkY, this.color.hex));
                    }

                    this.shimmerFrames++;
                    if (this.shimmerFrames >= this.maxShimmerFrames) {
                        this.state = 'fading';
                    }
                } else if (this.state === 'fading') {
                    this.y += 0.18; // Rơi nhẹ
                    this.alpha -= 0.024; // Mờ dần êm ái
                    if (this.alpha <= 0) {
                        this.dead = true;
                    }
                }

                // Cập nhật nhấp nháy cho các vì sao và hạt pháo
                for (let s of this.sparks) s.phase += s.speed;
                for (let star of this.innerStars) star.phase += star.speed;
            }

            draw(ctx) {
                if (this.dead || this.alpha <= 0) return;
                const displayAlpha = Math.max(0, Math.min(1.0, this.alpha));
                const rad = this.currentRadius;

                // 1. Viền tơ ánh sáng nối liền lạc tạo thành khối hình trái tim hoàn mỹ
                ctx.beginPath();
                for (let i = 0; i < FW_TOTAL_HEART_PTS; i++) {
                    const pt = FW_HEART_COORDS[i];
                    const px = this.x + pt.x * rad;
                    const py = this.y + pt.y * rad;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();

                // Quầng sáng mềm trong lòng trái tim
                ctx.fillStyle = this.color.hex;
                ctx.globalAlpha = displayAlpha * 0.07;
                ctx.fill();

                // Viền hào quang mềm mỏng
                ctx.strokeStyle = this.color.hex;
                ctx.lineWidth = 1.4;
                ctx.globalAlpha = displayAlpha * 0.36;
                ctx.stroke();

                // 2. Các hạt ngọc pháo hoa lấp lánh dọc viền trái tim (hiệu ứng pháo hoa kim tuyến)
                for (let s of this.sparks) {
                    const px = this.x + s.normX * rad;
                    const py = this.y + s.normY * rad;
                    const twinkle = 0.75 + Math.sin(s.phase) * 0.25;
                    const sparkAlpha = displayAlpha * twinkle;

                    // Hào quang mềm ngoài
                    ctx.beginPath();
                    ctx.arc(px, py, s.size * 2.0, 0, Math.PI * 2);
                    ctx.fillStyle = this.color.hex;
                    ctx.globalAlpha = sparkAlpha * 0.26;
                    ctx.fill();

                    // Hạt màu sắc nét
                    ctx.beginPath();
                    ctx.arc(px, py, s.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color.hex;
                    ctx.globalAlpha = sparkAlpha * 0.90;
                    ctx.fill();

                    // Tâm hạt sáng lóa như kim cương pháo hoa
                    ctx.beginPath();
                    ctx.arc(px, py, s.size * 0.42, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.globalAlpha = sparkAlpha * 0.95;
                    ctx.fill();
                }

                // 3. Các vì sao lung linh trong lòng trái tim
                for (let star of this.innerStars) {
                    const sx = this.x + star.relX * rad;
                    const sy = this.y + star.relY * rad;
                    const starAlpha = displayAlpha * (0.45 + Math.sin(star.phase) * 0.40);
                    if (starAlpha > 0.05) {
                        ctx.beginPath();
                        ctx.arc(sx, sy, star.size, 0, Math.PI * 2);
                        ctx.fillStyle = this.color.hex;
                        ctx.globalAlpha = starAlpha * 0.85;
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(sx, sy, star.size * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffffff';
                        ctx.globalAlpha = starAlpha * 0.65;
                        ctx.fill();
                    }
                }
            }
        }

        // Vòng lặp vẽ pháo hoa
        function loopCakeFireworks() {
            if (!fwIsRunning) return;
            fwAnimId = requestAnimationFrame(loopCakeFireworks);

            if (!fwCtx || !fwCanvas) return;
            const dpr = window.devicePixelRatio || 1;

            // Xóa sạch canvas để giữ nguyên độ trong suốt nhìn xuyên qua bánh 3D
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

            fwCtx.save();
            fwCtx.scale(dpr, dpr);
            fwCtx.globalCompositeOperation = 'lighter';

            // 1. Vẽ quầng sáng bầu trời khi pháo nổ (nhẹ dịu)
            for (let i = fwSkyFlashes.length - 1; i >= 0; i--) {
                const flash = fwSkyFlashes[i];
                flash.alpha -= flash.decay;
                if (flash.alpha <= 0) {
                    fwSkyFlashes.splice(i, 1);
                    continue;
                }
                const grad = fwCtx.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, flash.radius);
                grad.addColorStop(0, `rgba(${flash.r}, ${flash.g}, ${flash.b}, ${Math.max(0, flash.alpha).toFixed(3)})`);
                grad.addColorStop(1, `rgba(${flash.r}, ${flash.g}, ${flash.b}, 0)`);
                fwCtx.fillStyle = grad;
                fwCtx.beginPath();
                fwCtx.arc(flash.x, flash.y, flash.radius, 0, Math.PI * 2);
                fwCtx.fill();
            }

            // 2. Cập nhật & vẽ tàn lửa rocket
            for (let i = fwRocketSparks.length - 1; i >= 0; i--) {
                const sp = fwRocketSparks[i];
                sp.update();
                if (sp.dead) {
                    fwRocketSparks.splice(i, 1);
                } else {
                    sp.draw(fwCtx);
                }
            }

            // 3. Cập nhật & vẽ tàn kim tuyến hoa liễu rơi từ trái tim
            for (let i = fwWillowSparks.length - 1; i >= 0; i--) {
                const ws = fwWillowSparks[i];
                ws.update();
                if (ws.dead) {
                    fwWillowSparks.splice(i, 1);
                } else {
                    ws.draw(fwCtx);
                }
            }

            // 4. Cập nhật & vẽ các quả pháo đang phóng vút lên
            for (let i = fwRockets.length - 1; i >= 0; i--) {
                const r = fwRockets[i];
                r.update();
                if (r.dead) {
                    fwRockets.splice(i, 1);
                } else {
                    r.draw(fwCtx);
                }
            }

            // 5. Cập nhật & vẽ các khối pháo hoa HIỆU ỨNG TRÁI TIM tỏa sáng
            for (let i = fwBlooms.length - 1; i >= 0; i--) {
                const b = fwBlooms[i];
                b.update();
                if (b.dead) {
                    fwBlooms.splice(i, 1);
                } else {
                    b.draw(fwCtx);
                }
            }

            fwCtx.restore();
        }

        // Bắt đầu bắn pháo hoa
        function startCakeFireworks() {
            if (fwIsRunning) return;
            fwIsRunning = true;
            initCakeFireworksCanvas();

            const w = window.innerWidth;
            const h = window.innerHeight;

            // Bắn ngay cặp trái tim đầu tiên ở 2 bên ngoài bánh kem
            launchSingleCakeFirework(w * 0.15, h * 0.22, 'heart', FW_COLORS[0]);
            setTimeout(() => {
                if (fwIsRunning) launchSingleCakeFirework(w * 0.85, h * 0.22, 'heart', FW_COLORS[1]);
            }, 300);

            // Đặt lịch tự động bắn luân phiên 2 bên ngoài bánh kem nhịp nhàng êm ái (mỗi 0.85s - 1.25s)
            function scheduleNextLaunch() {
                if (!fwIsRunning) return;
                const nextDelay = Math.random() * 400 + 850;
                fwLaunchTimer = setTimeout(() => {
                    if (fwIsRunning) {
                        launchSingleCakeFirework();
                        scheduleNextLaunch();
                    }
                }, nextDelay);
            }
            scheduleNextLaunch();

            cancelAnimationFrame(fwAnimId);
            fwAnimId = requestAnimationFrame(loopCakeFireworks);
        }

        // Bắn 1 quả pháo hoa lên bầu trời
        function launchSingleCakeFirework(startX, targetY, shape, colorObj) {
            fwRockets.push(new FireworkRocket(startX, targetY, shape, colorObj));
        }

        // Đại tiệc pháo hoa bùng nổ khi Mẹ bấm thổi nến: Pháo hoa trái tim bắn rực rỡ ở 2 bên ngoài bánh sinh nhật
        function triggerCakeFireworksFinale() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            // Đợt 1: Cặp trái tim Đỏ Ruby (trái) & Hồng Ngọt Ngào (phải)
            launchSingleCakeFirework(w * 0.14, h * 0.22, 'heart', FW_COLORS[0]);
            launchSingleCakeFirework(w * 0.86, h * 0.22, 'heart', FW_COLORS[1]);

            // Đợt 2: Cặp trái tim Vàng Hoàng Gia (trái) & Tím Thạch Anh (phải)
            setTimeout(() => {
                if (fwIsRunning) {
                    launchSingleCakeFirework(w * 0.22, h * 0.16, 'heart', FW_COLORS[2]);
                    launchSingleCakeFirework(w * 0.78, h * 0.16, 'heart', FW_COLORS[3]);
                }
            }, 320);

            // Đợt 3: Cặp trái tim Xanh Lam Ngọc (trái) & Xanh Ngọc Bích (phải)
            setTimeout(() => {
                if (fwIsRunning) {
                    launchSingleCakeFirework(w * 0.10, h * 0.27, 'heart', FW_COLORS[4]);
                    launchSingleCakeFirework(w * 0.90, h * 0.27, 'heart', FW_COLORS[5]);
                }
            }, 640);

            // Đợt 4: Cặp trái tim Cam San Hô (trái) & Trắng Pha Lê (phải)
            setTimeout(() => {
                if (fwIsRunning) {
                    launchSingleCakeFirework(w * 0.18, h * 0.19, 'heart', FW_COLORS[6]);
                    launchSingleCakeFirework(w * 0.82, h * 0.19, 'heart', FW_COLORS[7]);
                }
            }, 960);
        }

        // Dừng pháo hoa khi chuyển sang màn hình khác
        function stopCakeFireworks() {
            fwIsRunning = false;
            clearTimeout(fwLaunchTimer);
            cancelAnimationFrame(fwAnimId);
            fwRockets = [];
            fwBlooms = [];
            fwRocketSparks = [];
            fwWillowSparks = [];
            fwSkyFlashes = [];
            if (fwCtx && fwCanvas) {
                fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            }
        }

        /* ========================================================
           6. MÀN HÌNH 4: BỨC THƯ TAY CHẠY TỪNG CHỮ (TYPEWRITER)
           ======================================================== */

        function startLetterTyping() {
            if (!letterContentText) return;

            clearTimeout(typingTimer);
            isTyping = true;
            typingCharIndex = 0;
            letterContentText.innerHTML = '';

            if (letterSignature) letterSignature.classList.remove('visible');

            if (letterViewport) {
                letterViewport.scrollTop = 0;
            }

            const cursorSpan = document.createElement('span');
            cursorSpan.className = 'typing-cursor';

            function typeNextChar() {
                if (!isTyping) return;

                if (typingCharIndex < LETTER_FULL_TEXT.length) {
                    const char = LETTER_FULL_TEXT[typingCharIndex];
                    typingCharIndex++;

                    letterContentText.textContent = LETTER_FULL_TEXT.slice(0, typingCharIndex);
                    letterContentText.appendChild(cursorSpan);

                    // Tự động cuộn nhẹ nhàng theo dòng chữ mới nhất nếu đã vượt chiều cao màn hình
                    if (letterViewport) {
                        const targetScroll = letterViewport.scrollHeight - letterViewport.clientHeight;
                        if (targetScroll > 0 && targetScroll - letterViewport.scrollTop > 4) {
                            letterViewport.scrollTop += (targetScroll - letterViewport.scrollTop) * 0.45;
                        }
                    }

                    // Tinh chỉnh nhịp gõ chữ cảm xúc tự nhiên
                    let delay = 26; // Tốc độ gõ chữ mượt mà (~26ms/ký tự)
                    if (char === ',') delay = 120;
                    else if (char === '.' || char === '!' || char === '?') delay = 240;
                    else if (char === '\n') {
                        if (typingCharIndex < LETTER_FULL_TEXT.length && LETTER_FULL_TEXT[typingCharIndex] === '\n') {
                            delay = 280;
                        } else {
                            delay = 140;
                        }
                    }

                    typingTimer = setTimeout(typeNextChar, delay);
                } else {
                    finishTypingLetter();
                }
            }

            typingTimer = setTimeout(typeNextChar, 350);
        }

        let nightSkyAnimId = null;
        let nightSkyInitialized = false;

        function initNightSkyCanvas() {
            if (nightSkyInitialized) return;
            nightSkyInitialized = true;

            const skyCanvas = document.getElementById('night-sky-canvas');
            if (!skyCanvas) return;
            const ctx = skyCanvas.getContext('2d');
            if (!ctx) return;

            let width = window.innerWidth;
            let height = window.innerHeight;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);

            function resizeSky() {
                width = window.innerWidth;
                height = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                skyCanvas.width = width * dpr;
                skyCanvas.height = height * dpr;
                skyCanvas.style.width = width + 'px';
                skyCanvas.style.height = height + 'px';
            }
            resizeSky();
            window.addEventListener('resize', resizeSky);

            // Danh sách các gam màu sao thiên văn tự nhiên
            const starColorPalettes = [
                'rgba(255, 255, 255,',     // Trắng ngọc tinh khôi
                'rgba(224, 242, 254,',     // Xanh thiên thanh dịu mát
                'rgba(254, 243, 199,',     // Ánh vàng ngà ấm áp
                'rgba(250, 232, 255,',     // Tím hồng pastel mộng mơ
                'rgba(255, 228, 230,'      // Hồng phấn dịu êm
            ];

            // 380 ngôi sao rải đều khắp không gian bầu trời
            const stars = [];
            const numStars = 380;
            for (let i = 0; i < numStars; i++) {
                const isBright = Math.random() < 0.09;
                const baseRadius = isBright ? (1.5 + Math.random() * 1.3) : (0.45 + Math.random() * 0.95);
                stars.push({
                    x: Math.random(),
                    y: Math.random(),
                    r: baseRadius,
                    color: starColorPalettes[Math.floor(Math.random() * starColorPalettes.length)],
                    baseAlpha: 0.3 + Math.random() * 0.45,
                    twinkleAmp: 0.22 + Math.random() * 0.35,
                    twinkleSpeed: 0.0016 + Math.random() * 0.0042,
                    phase: Math.random() * Math.PI * 2,
                    hasCrossSpike: isBright && Math.random() < 0.42
                });
            }

            // Hệ thống sao băng (Shooting Stars / Meteors)
            let meteors = [];
            let nextMeteorTime = performance.now() + 1500;

            function spawnMeteor(now) {
                const startX = (0.2 + Math.random() * 0.75) * width;
                const startY = Math.random() * (height * 0.4);
                const angle = (Math.PI / 4) + (Math.random() - 0.5) * 0.32;
                const speed = 13 + Math.random() * 9;
                const length = 110 + Math.random() * 90;
                const duration = 720 + Math.random() * 450;

                meteors.push({
                    startTime: now,
                    duration: duration,
                    x: startX,
                    y: startY,
                    vx: -Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    length: length,
                    thickness: 1.4 + Math.random() * 1.1
                });

                // Cứ 3.5s - 7s xuất hiện một dải sao băng lung linh
                nextMeteorTime = now + 3500 + Math.random() * 3500;
            }

            function drawSky(timestamp) {
                nightSkyAnimId = requestAnimationFrame(drawSky);

                const screenGlobe = document.getElementById('screen-photo-globe');
                if (screenGlobe && !screenGlobe.classList.contains('active')) {
                    return;
                }

                ctx.save();
                ctx.scale(dpr, dpr);
                ctx.clearRect(0, 0, width, height);

                // 1. Vầng hào quang khí quyển dịu êm phía sau quả địa cầu
                const auraRadius = Math.min(width, height) * 0.38;
                const auraGrad = ctx.createRadialGradient(width * 0.5, height * 0.5, auraRadius * 0.3, width * 0.5, height * 0.5, auraRadius);
                auraGrad.addColorStop(0, 'rgba(56, 112, 230, 0.22)');
                auraGrad.addColorStop(0.5, 'rgba(30, 64, 175, 0.09)');
                auraGrad.addColorStop(1, 'rgba(15, 23, 42, 0)');
                ctx.fillStyle = auraGrad;
                ctx.beginPath();
                ctx.arc(width * 0.5, height * 0.5, auraRadius, 0, Math.PI * 2);
                ctx.fill();

                // 2. Vẽ 380 ngôi sao lấp lánh (vẽ hình tròn mềm mại, loại bỏ hoàn toàn ô vuông đen)
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    const sx = s.x * width;
                    const sy = s.y * height;
                    const alpha = Math.max(0.08, Math.min(1.0, s.baseAlpha + s.twinkleAmp * Math.sin(timestamp * s.twinkleSpeed + s.phase)));

                    ctx.fillStyle = s.color + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
                    ctx.fill();

                    // Vầng hào quang nhẹ và tia chớp kim cương cho các ngôi sao lớn
                    if (s.r > 1.7) {
                        ctx.fillStyle = s.color + (alpha * 0.25) + ')';
                        ctx.beginPath();
                        ctx.arc(sx, sy, s.r * 2.6, 0, Math.PI * 2);
                        ctx.fill();

                        if (s.hasCrossSpike && alpha > 0.62) {
                            ctx.strokeStyle = s.color + (alpha * 0.45) + ')';
                            ctx.lineWidth = 0.8;
                            const spikeLen = s.r * 3.4;
                            ctx.beginPath();
                            ctx.moveTo(sx - spikeLen, sy);
                            ctx.lineTo(sx + spikeLen, sy);
                            ctx.moveTo(sx, sy - spikeLen);
                            ctx.lineTo(sx, sy + spikeLen);
                            ctx.stroke();
                        }
                    }
                }

                // 3. Xử lý và vẽ các vệt sao băng (Meteors)
                if (timestamp >= nextMeteorTime) {
                    spawnMeteor(timestamp);
                }

                for (let m = meteors.length - 1; m >= 0; m--) {
                    const met = meteors[m];
                    const progress = (timestamp - met.startTime) / met.duration;
                    if (progress >= 1.0) {
                        meteors.splice(m, 1);
                        continue;
                    }

                    const headX = met.x + met.vx * (timestamp - met.startTime) * 0.06;
                    const headY = met.y + met.vy * (timestamp - met.startTime) * 0.06;

                    const dirX = -met.vx;
                    const dirY = -met.vy;
                    const dirLen = Math.hypot(dirX, dirY) || 1;
                    const tailX = headX + (dirX / dirLen) * met.length;
                    const tailY = headY + (dirY / dirLen) * met.length;

                    const fade = progress < 0.2 ? (progress / 0.2) : (1.0 - (progress - 0.2) / 0.8);
                    const meteorAlpha = Math.max(0, fade * 0.95);

                    const grad = ctx.createLinearGradient(headX, headY, tailX, tailY);
                    grad.addColorStop(0, `rgba(255, 255, 255, ${meteorAlpha})`);
                    grad.addColorStop(0.2, `rgba(186, 230, 253, ${meteorAlpha * 0.85})`);
                    grad.addColorStop(0.7, `rgba(147, 197, 253, ${meteorAlpha * 0.35})`);
                    grad.addColorStop(1, 'rgba(59, 130, 246, 0)');

                    ctx.strokeStyle = grad;
                    ctx.lineWidth = met.thickness;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(headX, headY);
                    ctx.lineTo(tailX, tailY);
                    ctx.stroke();

                    // Đầu sao băng sáng lấp lánh
                    ctx.fillStyle = `rgba(255, 255, 255, ${meteorAlpha})`;
                    ctx.beginPath();
                    ctx.arc(headX, headY, met.thickness * 1.3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            nightSkyAnimId = requestAnimationFrame(drawSky);
        }

        // Vẽ hình chữ nhật bo góc tương thích mọi trình duyệt
        function drawRoundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // Vẽ ảnh cắt cúp chuẩn (cover) tập trung khuôn mặt phía trên
        function drawImageCover(ctx, img, x, y, w, h) {
            const imgRatio = img.naturalWidth / img.naturalHeight;
            const targetRatio = w / h;
            let sw, sh, sx, sy;
            if (imgRatio > targetRatio) {
                sh = img.naturalHeight;
                sw = img.naturalHeight * targetRatio;
                sx = (img.naturalWidth - sw) / 2;
                sy = 0;
            } else {
                sw = img.naturalWidth;
                sh = img.naturalWidth / targetRatio;
                sx = 0;
                // Với ảnh dọc đứng, lấy trọng tâm 18% từ trên xuống để trọn vẹn khuôn mặt gia đình
                sy = Math.max(0, (img.naturalHeight - sh) * 0.18);
            }
            ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
        }

        // Tạo texture cho từng mảnh ghép ảnh gia đình thật
        function createFamilyPhotoTileTexture(img, title, index) {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 340;
            const ctx = canvas.getContext('2d');

            // Nền dự phòng màu pastel ấm áp
            const photoGrad = ctx.createLinearGradient(0, 0, 400, 340);
            const palettes = [
                ['#ffe4e6', '#fda4af'],
                ['#fef3c7', '#fcd34d'],
                ['#dcfce7', '#86efac'],
                ['#fae8ff', '#f0abfc'],
                ['#e0f2fe', '#7dd3fc']
            ];
            const pal = palettes[index % palettes.length];
            photoGrad.addColorStop(0, pal[0]);
            photoGrad.addColorStop(1, pal[1]);
            ctx.fillStyle = photoGrad;
            ctx.fillRect(0, 0, 400, 340);

            // Vẽ ảnh gia đình thật (Tràn viền 100%, không chữ, không viền)
            if (img && (img.complete || img.naturalWidth > 0)) {
                drawImageCover(ctx, img, 0, 0, 400, 340);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.generateMipmaps = true;
            texture.minFilter = THREE.LinearMipmapLinearFilter;

            return {
                texture: texture,
                canvas: canvas,
                title: title,
                img: img
            };
        }

        // Tự động điều chỉnh góc nhìn và khoảng cách camera tương thích cả Mobile và Desktop
        function updateCameraDistance() {
            if (!globeCamera) return;
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 1) {
                // Màn hình dọc trên điện thoại: lùi camera ra xa để quả địa cầu trọn vẹn 84% chiều ngang
                globeCamera.position.z = Math.max(28, 18.2 / aspect);
            } else {
                globeCamera.position.z = 21.5;
            }
            globeCamera.aspect = aspect;
            globeCamera.updateProjectionMatrix();
        }

            globeInitialized = true;

            globeRenderer.setSize(window.innerWidth, window.innerHeight);

            const coreGeo = new THREE.SphereGeometry(7.35, 48, 48);
            const coreMat = new THREE.MeshStandardMaterial({
                color: 0x0e0316,
                roughness: 0.85,
                metalness: 0.12,

            // 2. KHỐI CẦU 3D ĐƯỢC GHÉP KHÍT 100% BẰNG CÁC MẢNH ẢNH GIA ĐÌNH THẬT
            const globeRadius = 7.42;
            photoTileMeshes = [];

            // Tạo sẵn 5 texture ảnh gia đình thật
            const cachedPhotoData = [];
            for (let j = 0; j < familyPhotoMeta.length; j++) {

            // Chia bề mặt địa cầu thành 8 đai vĩ độ từ Cực Bắc tới Cực Nam

            const rowsConfig = [4, 8, 12, 14, 14, 12, 8, 4]; // Tổng cộng 76 mảnh ghép khít hoàn hảo
            const totalRings = rowsConfig.length;
            const thetaStep = Math.PI / totalRings;
            let tileIndex = 0;

            for (let r = 0; r < totalRings; r++) {
                const thetaStart = r * thetaStep;
                const thetaLength = thetaStep;
